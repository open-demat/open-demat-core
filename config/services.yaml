# config/services.yaml
parameters:
  organization_logo_default: 'assets/img/open-demat-logo.png'
  s3.bucket: '%env(S3_BUCKET)%'

  admin_url: '%env(resolve:ADMIN_URL)%'
  organization_name: '%env(default::ORGANIZATION_NAME)%'
  organization_logo: '%env(default:organization_logo_default:ORGANIZATION_LOGO)%'
  theme_primary_color: '%env(default::THEME_PRIMARY_COLOR)%'
  theme_primary_dark_color: '%env(default::THEME_PRIMARY_DARK_COLOR)%'
  local_admin_username: '%env(string:LOCAL_ADMIN_USERNAME)%'
  local_admin_password: '%env(string:LOCAL_ADMIN_PASSWORD)%'
  cas_enabled: '%env(bool:CAS_ENABLED)%'
  cas_host: '%env(CAS_HOST)%'
  cas_port: '%env(CAS_PORT)%'
  cas_path: '%env(CAS_PATH)%'
  cas_login_target: '%env(resolve:CAS_LOGIN_TARGET)%'
  cas_gateway: '%env(bool:CAS_GATEWAY)%'
  ldap_enabled: '%env(bool:LDAP_ENABLED)%'
  ldap_connection_string: '%env(string:LDAP_CONNECTION_STRING)%'
  ldap_base_dn: '%env(string:LDAP_BASE_DN)%'
  ldap_search_filter: '%env(string:LDAP_SEARCH_FILTER)%'
  ldap_bind_dn: '%env(string:LDAP_BIND_DN)%'
  ldap_bind_password: '%env(string:LDAP_BIND_PASSWORD)%'
  ldap_identifier_attribute: '%env(string:LDAP_IDENTIFIER_ATTRIBUTE)%'
  ldap_email_attribute: '%env(string:LDAP_EMAIL_ATTRIBUTE)%'
  ldap_first_name_attribute: '%env(string:LDAP_FIRST_NAME_ATTRIBUTE)%'
  ldap_last_name_attribute: '%env(string:LDAP_LAST_NAME_ATTRIBUTE)%'
  ldap_auto_create_user: '%env(bool:LDAP_AUTO_CREATE_USER)%'
  saml2_enabled: '%env(bool:SAML2_ENABLED)%'
  saml2_identifier_attribute: '%env(string:SAML2_IDENTIFIER_ATTRIBUTE)%'
  saml2_email_attribute: '%env(string:SAML2_EMAIL_ATTRIBUTE)%'
  saml2_first_name_attribute: '%env(string:SAML2_FIRST_NAME_ATTRIBUTE)%'
  saml2_last_name_attribute: '%env(string:SAML2_LAST_NAME_ATTRIBUTE)%'
  saml2_auto_create_user: '%env(bool:SAML2_AUTO_CREATE_USER)%'

imports:
  - { resource: '../app_open_demat/*/Resources/config/services.yaml', type: glob, ignore_errors: true }

when@test:
  services:
    security.user.provider.concrete.cas_user_provider:
      alias: security.user.provider.concrete.app_user_provider
      public: false

services:
  _defaults:
    autowire: true
    autoconfigure: true
  
  OpenDemat\Core\:
    resource: '../src/*'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  OpenDemat\Core\Routing\PerBundleAttributeLoader:
      arguments:
        $projectDir: '%kernel.project_dir%'
      tags: [routing.loader]
  
  OpenDemat\Core\Security\CasToUserProvider:
      arguments:
          $userRepository: '@OpenDemat\Core\Repository\UserRepository'

  OpenDemat\Core\Security\LocalAdminAuthenticator:
      arguments:
          $adminUsername: '%local_admin_username%'
          $adminPassword: '%local_admin_password%'

  OpenDemat\Core\Security\LdapAuthenticator:
      arguments:
          $enabled: '%ldap_enabled%'
          $connectionString: '%ldap_connection_string%'
          $baseDn: '%ldap_base_dn%'
          $searchFilter: '%ldap_search_filter%'
          $bindDn: '%ldap_bind_dn%'
          $bindPassword: '%ldap_bind_password%'
          $identifierAttribute: '%ldap_identifier_attribute%'
          $emailAttribute: '%ldap_email_attribute%'
          $firstNameAttribute: '%ldap_first_name_attribute%'
          $lastNameAttribute: '%ldap_last_name_attribute%'
          $autoCreateUser: '%ldap_auto_create_user%'

  OpenDemat\Core\Security\Saml2AuthFactory:
      arguments:
          $projectDir: '%kernel.project_dir%'
          $idpMetadataFile: '%env(string:SAML2_IDP_METADATA_FILE)%'
          $idpMetadataUrl: '%env(string:SAML2_IDP_METADATA_URL)%'
          $idpMetadataXml: '%env(string:SAML2_IDP_METADATA_XML)%'
          $settings:
              strict: '%env(bool:SAML2_STRICT)%'
              debug: '%env(bool:SAML2_DEBUG)%'
              baseurl: '%env(resolve:ADMIN_URL)%'
              sp:
                  entityId: '%env(resolve:SAML2_SP_ENTITY_ID)%'
                  assertionConsumerService:
                      url: '%env(resolve:SAML2_SP_ACS_URL)%'
                      binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST'
                  singleLogoutService:
                      url: '%env(resolve:SAML2_SP_SLS_URL)%'
                      binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                  NameIDFormat: '%env(string:SAML2_SP_NAME_ID_FORMAT)%'
                  x509cert: '%env(default::SAML2_SP_X509_CERT)%'
                  privateKey: '%env(default::SAML2_SP_PRIVATE_KEY)%'
              idp:
                  entityId: '%env(resolve:SAML2_IDP_ENTITY_ID)%'
                  singleSignOnService:
                      url: '%env(resolve:SAML2_IDP_SSO_URL)%'
                      binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                  singleLogoutService:
                      url: '%env(resolve:SAML2_IDP_SLO_URL)%'
                      binding: 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect'
                  x509cert: '%env(default::SAML2_IDP_X509_CERT)%'
              security:
                  authnRequestsSigned: '%env(bool:SAML2_AUTHN_REQUESTS_SIGNED)%'
                  logoutRequestSigned: '%env(bool:SAML2_LOGOUT_REQUEST_SIGNED)%'
                  logoutResponseSigned: '%env(bool:SAML2_LOGOUT_RESPONSE_SIGNED)%'
                  wantMessagesSigned: '%env(bool:SAML2_WANT_MESSAGES_SIGNED)%'
                  wantAssertionsSigned: '%env(bool:SAML2_WANT_ASSERTIONS_SIGNED)%'
                  wantAssertionsEncrypted: '%env(bool:SAML2_WANT_ASSERTIONS_ENCRYPTED)%'
                  wantNameIdEncrypted: '%env(bool:SAML2_WANT_NAME_ID_ENCRYPTED)%'
                  signMetadata: '%env(bool:SAML2_SIGN_METADATA)%'

  OpenDemat\Core\Security\SAML2Authenticator:
      arguments:
          $enabled: '%saml2_enabled%'
          $attributeMap:
              identifier: '%saml2_identifier_attribute%'
              email: '%saml2_email_attribute%'
              first_name: '%saml2_first_name_attribute%'
              last_name: '%saml2_last_name_attribute%'
          $autoCreateUser: '%saml2_auto_create_user%'

  OpenDemat\Core\Security\CasAuthenticator:
      arguments:
          $enabled: '%cas_enabled%'
  
  # ------- PSR-17 (Nyholm) -------
  Nyholm\Psr7\Factory\Psr17Factory: ~

  Psr\Http\Message\RequestFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
  Psr\Http\Message\ResponseFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
  Psr\Http\Message\ServerRequestFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
  Psr\Http\Message\StreamFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
  Psr\Http\Message\UploadedFileFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'
  Psr\Http\Message\UriFactoryInterface: '@Nyholm\Psr7\Factory\Psr17Factory'

  # ------- Adaptateur attendu par ecphp/cas-lib -------
  loophp\psr17\Psr17:
    arguments:
      - '@Psr\Http\Message\RequestFactoryInterface'
      - '@Psr\Http\Message\ResponseFactoryInterface'
      - '@Psr\Http\Message\ServerRequestFactoryInterface'
      - '@Psr\Http\Message\StreamFactoryInterface'
      - '@Psr\Http\Message\UploadedFileFactoryInterface'
      - '@Psr\Http\Message\UriFactoryInterface'

  loophp\psr17\Psr17Interface: '@loophp\psr17\Psr17'

  # ------- Bridge PSR-7 <-> HttpFoundation -------
  # HttpFoundation <- PSR-7 (pour convertir PSR-7 vers HttpFoundation)
  Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory: ~
  Symfony\Bridge\PsrHttpMessage\HttpFoundationFactoryInterface: '@Symfony\Bridge\PsrHttpMessage\Factory\HttpFoundationFactory'

  # PSR-7 <- HttpFoundation (l'autre sens, utile si besoin)
  Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory:
    arguments:
      - '@Psr\Http\Message\RequestFactoryInterface'
      - '@Psr\Http\Message\ResponseFactoryInterface'
      - '@Psr\Http\Message\StreamFactoryInterface'
      - '@Psr\Http\Message\UploadedFileFactoryInterface'

  # --- Client PSR-18 basé sur Symfony HttpClient ---
  Symfony\Component\HttpClient\Psr18Client:
    arguments:
      - '@http_client'                             # Symfony\Contracts\HttpClient\HttpClientInterface
      - '@Psr\Http\Message\RequestFactoryInterface'
      - '@Psr\Http\Message\StreamFactoryInterface'

  # Alias pour l’interface PSR-18 attendue par cas-lib
  Psr\Http\Client\ClientInterface: '@Symfony\Component\HttpClient\Psr18Client'

  OpenDemat\Core\Hub\HubAppSynchronizer:
    arguments:
      $em: '@doctrine.orm.entity_manager'
      $urlGenerator: '@router'

  OpenDemat\Core\Hub\HubRegistry:
    arguments:
      $apps: !tagged_iterator 'open_demat.hub.app_definition'

  OpenDemat\Core\Twig\HubExtension:
    arguments:
      - '@OpenDemat\Core\Hub\HubRegistry'
    tags:
      - 'twig.extension'
  
  OpenDemat\Core\Mailer\:
    resource: '../src/Mailer/'
    autowire: true
    autoconfigure: true
  
  OpenDemat\Core\Mailer\Handler\SendMailMessageHandler:
    arguments:
      $defaultFrom: '%env(string:MAILER_FROM)%'
  
  Aws\S3\S3Client:
    factory: ['Aws\S3\S3Client', 'factory']
    arguments:
      -
        version: 'latest'
        region: '%env(S3_REGION)%'
        endpoint: '%env(S3_ENDPOINT)%'
        use_path_style_endpoint: '%env(bool:S3_USE_PATH_STYLE)%'
        credentials:
          key: '%env(S3_ACCESS_KEY)%'
          secret: '%env(S3_SECRET_KEY)%'
          
  OpenDemat\Core\Service\AttachmentService:
    arguments:
      $s3Bucket: '%s3.bucket%'

  OpenDemat\Core\Service\StaticDocumentService:
    arguments:
      $s3Bucket: '%s3.bucket%'
  
  OpenDemat\Core\Pdf\PdfRendererInterface:
    alias: OpenDemat\Core\Pdf\PdfRenderer

  OpenDemat\Core\Pdf\Engine\PdfEngineInterface:
    class: OpenDemat\Core\Pdf\Engine\DompdfEngine

  OpenDemat\Core\Pdf\PdfRenderer:
    arguments:
      $twig: '@twig'
      $engine: '@OpenDemat\Core\Pdf\Engine\PdfEngineInterface'
  
  OpenDemat\Core\EventSubscriber\SessionVersionSubscriber:
        arguments:
            $tokenStorage: '@security.token_storage'
            $requestStack: '@request_stack'
            $router: '@router'
            $userRepository: '@OpenDemat\Core\Repository\UserRepository'
        tags:
            - { name: kernel.event_subscriber }

  OpenDemat\Core\AuditLog\AuditLoggerInterface:
        alias: OpenDemat\Core\AuditLog\AuditLogger

  OpenDemat\Core\AuditLog\AuditLogger:
      arguments:
          $entityManager: '@doctrine.orm.entity_manager'
          $security: '@security.helper'
          $requestStack: '@request_stack'

  OpenDemat\Core\EventSubscriber\WorkflowAuditSubscriber:
      tags:
          - { name: kernel.event_subscriber }
